summary: >
  Group F1 of the wave 2 follow-ups, runs in parallel with T030 and T032; no contract change here. (1) Q-40, #170
  (the project owner, 2026-11-27: cap versions in the contract): GET /artifacts/{name}/versions/{version} with a
  version above 9223372036854775807 (2^63-1) is 422 validation_failed (location path.version), replacing today's
  short-circuit to 404 (MAX_VERSION in app/routers/artifacts.py); precedence 422 then 404 as in the contract.
  2^63-1 itself is a valid version: 404 when not stored. The store never assigns a version above the cap: when the
  next version of a name would exceed it, nothing is stored (no blob file left behind, no row, no event) and the
  answer is 500 internal_error (test it by seeding a row at 2^63-1). Adjust the existing test in
  tests/test_store_api.py that expects 404 above the cap. (2) Q-42, #171 (the project owner, 2026-11-27: fix now):
  the artifact.uploaded sender follows the new event-sender convention in docs/PLAN.md § Conventions exactly: 5 s
  total deadline per event (attempt timeout min(2 s, time left), waits 0.5 s then 1 s, no attempt or wait past the
  deadline, then drop and log), same event_id on every attempt, retry only on a network error, a timeout or a 5xx,
  one httpx.AsyncClient per app closed in the lifespan, each send its own asyncio task on the server's event loop,
  never on the handler thread pool and never awaited by the upload handler or a background task; at most 1000
  events pending (one more is dropped and logged); at shutdown pending sends are cancelled within 1 s. The send is
  still scheduled only after the upload's commit. Keep the deadline, the attempt timeout, the waits and the
  pending cap injectable for tests (defaults as above); give tests a way to wait until no send is pending instead
  of sleeping. test_q42_hanging_dashboard_does_not_delay_other_requests runs the real app with uvicorn in a
  background thread on a free 127.0.0.1 port, with DASHBOARD_URL pointing at a local listener that accepts
  connections and never answers, sends 80 concurrent uploads (each 201), then, while those events are still
  pending, one unrelated request (a GET download of a stored version) that must answer within 1.0 s; run it once
  on the unfixed code and record that time in the hand-off as "unfixed: <n> s". The test also asserts, through a test hook on the sender that reports the number of pending sends, that at least one event is still
  pending at the moment the GET is timed, so the GET is measured while the dashboard is hanging. Update the existing sender tests
  (tests/test_store_events.py, tests/conftest.py) to the async sender without weakening what they prove. No new
  package (asyncio and httpx.AsyncClient). Never edit the T022 copies. Hand-off docs/tasks/T031.md.
