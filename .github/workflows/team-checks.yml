name: team-checks

on:
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  task-scope:
    name: changes stay inside the task's files_touched
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --break-system-packages pyyaml==6.0.2
      - name: Self-test the task-scope check
        run: python3 scripts/ci/check_task_scope.py --self-test
      - name: Check task scope
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: origin/${{ github.base_ref }}
        run: python3 scripts/ci/check_task_scope.py "$BRANCH" "$BASE"

  alembic-heads:
    name: exactly one Alembic head per migrations folder
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check heads
        run: python3 scripts/ci/check_alembic_heads.py .

  sync-scope:
    name: team-sync branches change only files in docs/team/SYNC_FILES
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --break-system-packages pyyaml==6.0.2
      - name: Self-test
        run: python3 scripts/ci/check_sync_scope.py --self-test
      - name: Check sync scope
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: origin/${{ github.base_ref }}
        run: python3 scripts/ci/check_sync_scope.py "$BRANCH" "$BASE"

  lead-lock:
    name: lead lock script works and the hooks are wired
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Self-test the lead lock (offline)
        run: python3 scripts/team/lead_lock.py --self-test
      - name: Check the four hooks are in .claude/settings.json
        run: python3 scripts/team/lead_lock.py check-settings .claude/settings.json
