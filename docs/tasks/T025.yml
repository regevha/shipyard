summary: >
  Wave 2b, runs in parallel with T023 and T024. Implements contracts/api-artifact-store.yml exactly. POST
  /artifacts/{name}?build_id=... with the raw bytes as application/octet-stream (Q-18 default): the next
  integer version per name starting at 1, every upload a new version (Q-17, #33); SHA-256 computed by the
  store; optional X-Checksum-SHA256, a mismatch is 422 checksum_mismatch and nothing is stored; a body over
  104857600 bytes is 413 payload_too_large, checked in app code (read the body in chunks and stop past the limit,
  never hold more than the limit in memory); error precedence 413, then 422 validation_failed (path, query,
  header), then 422 checksum_mismatch. 201 answers the Artifact (name, version, checksum, size_bytes, build_id
  as sent, uploaded_at). Names follow Q-29 (#86): letters, digits, . - _; first a letter or digit; 1-100
  characters; case-sensitive; anything else is 422 (a trailing newline too, #121). The store does not call
  pipeline-runner; build_id is recorded as sent (Q-17). GET /artifacts/{name}/versions/{version}: the bytes
  with X-Checksum-SHA256, 404 not_found if unknown. Bytes are files under $SHIPYARD_DATA_DIR/artifact_store_blobs/
  written by a module in app/repos/, the database holds metadata and the path (environment.md Data access row);
  the file is written and the row committed before the 201. Then artifact.uploaded is sent per PLAN.md §
  Conventions (after commit, background, never changes the upload). Uploads are accepted whatever the build's
  later outcome: assumed (#131), option (a); option (c) would not change this task. app/main.py: install(app),
  routers, create_all at startup (ARTIFACT_STORE_DATABASE_URL); DASHBOARD_URL for events. Tests use tmp_path
  for the data dir and an in-memory database, and fake the dashboard with httpx.MockTransport. Never edit the
  T022 copies. Write services/artifact-store/DATA_MODEL.md and the hand-off docs/tasks/T025.md (endpoints, env
  vars, where blobs live, how the 413 is detected).
