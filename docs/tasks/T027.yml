  - "browser smoke test (Playwright with system Chrome) against the real dashboard from T023 in the agent's slot, seeded with events by curl: the four views render, status=failed shows only failed builds with the failed step or 'artifact upload failed', a build with null fields renders, the page refreshes without a reload, no console errors (review gate; unverified if no browser is available)"
  - "ux-reviewer looked at the running page; reviewer APPROVE (review gates, not commands)"
summary: >
  Wave 2c, runs in parallel with T026. Replaces the T021 placeholder in services/dashboard/static/ with
  index.html, app.js and style.css: plain HTML and a little JavaScript, no build step, no framework, no
  external host or CDN (Q-02, brief). Served by the dashboard: index.html at /, the other files under /static/ (T023's route and mount; never edit
  services/dashboard/app/ or tests/). The page fetches only the dashboard's own JSON: GET /builds, GET
  /builds?status=failed (failures view), GET /artifacts, GET /releases (Q-23), and refreshes every 5 seconds
  without a page reload. Shows builds (pipeline name, build_id, status, started and finished times, steps,
  the failed step or the failure_reason "artifact upload failed", #120), failures, artifacts (name, version,
  checksum, size, build_id, uploaded_at) and releases (artifact, status pending/approved/rejected, requested_by,
  decided_by, times; Q-30). Fields that are null (event not arrived yet) show as a dash. No approve, reject or
  promote buttons and no write request (Q-32, #89); no promotion shown (Q-14, Q-31). assumed (#131): option
  (a), an artifact whose build failed is listed like any other; under option (c) this task would hide it.
  Render all event data with textContent (anyone can post events, Q-09). Hand-off docs/tasks/T027.md: the views,
  the refresh interval, how to run the smoke test (slot, seed commands).
