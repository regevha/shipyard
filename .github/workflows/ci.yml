name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  # On main every commit gets its own group, so each one finishes and reports ci-ok.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contracts:
    name: contracts and task specs are valid
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-contracts.txt
      - name: Install the checker's pinned packages
        run: python3 -m pip install -r scripts/ci/requirements-contracts.txt
      - name: Self-test the contract checker
        run: python3 scripts/ci/check_contracts.py --self-test
      - name: Check contracts and task specs
        run: python3 scripts/ci/check_contracts.py

  service:
    name: service (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [pipeline-runner, artifact-store, release-service, dashboard]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests with coverage (threshold is fail_under in pyproject.toml)
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Export locked requirements
        run: uv export --locked --no-emit-project --no-hashes -o /tmp/requirements-audit.txt
      - name: Dependency audit
        run: uvx pip-audit==2.10.1 --requirement /tmp/requirements-audit.txt --disable-pip --no-deps

  shared-copy:
    name: shared files are identical in every service
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Self-test the copy checker
        run: python3 scripts/ci/check_shared_copy.py --self-test
      - name: Check the copies
        run: python3 scripts/ci/check_shared_copy.py

  stack:
    name: stack tests (all four services)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The runner is a fresh checkout (not an agent worktree); stack-tests require the slot explicitly.
      SHIPYARD_SLOT: "0"
    defaults:
      run:
        working-directory: stack-tests
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: |
            services/*/uv.lock
            stack-tests/uv.lock
      # Before start-stack.sh (#154): venvs and CPython must not be installed inside its 30 s wait.
      - name: Install locked dependencies of the four services and stack-tests
        working-directory: .
        run: |
          for dir in services/pipeline-runner services/artifact-store services/release-service \
            services/dashboard stack-tests; do
            (cd "$dir" && uv sync --locked)
          done
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Stack tests (start and stop the stack themselves)
        run: uv run pytest -v --durations=10
      - name: Service logs on failure
        if: failure()
        working-directory: .
        run: |
          shopt -s nullglob
          for log in /tmp/shipyard/slot0/*.log; do
            echo "::group::$log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done

  # The one check to require in branch protection. Add every new job of this
  # workflow to `needs` so it cannot be skipped silently.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [contracts, service, shared-copy, stack]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job finished with '$result'"
              exit 1
            fi
          done
