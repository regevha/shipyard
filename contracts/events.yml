$schema: https://json-schema.org/draft/2020-12/schema
$id: https://shipyard.invalid/contracts/events.yml
title: Shipyard events
description: >
  Events that pipeline-runner, artifact-store and release-service POST to the dashboard's events endpoint
  (`POST /events` in api-dashboard.yml, whose request body is this file's root schema). The root schema is
  "any valid event": exactly one of the five event types below. Every event type is the shared Envelope plus a
  fixed `type`, `source` and `schema_version` and a closed `data` object. The shared value schemas at the end
  (BuildId, ReleaseId, Timestamp, Artifact, ArtifactRef, StepResult, ...) are the single definition of those
  concepts; the four api-*.yml files refer to them instead of redefining them.
$defs:

  # ---------------------------------------------------------------- envelope (shared part)

  Envelope:
    x-assumed: [Q-12]
    description: >
      Common shape of every event (Q-12 default). An open allOf member: each event type composes it and closes
      the result with unevaluatedProperties: false.
    type: object
    required: [event_id, type, schema_version, occurred_at, source, data]
    properties:
      event_id:
        x-assumed: [Q-11, Q-15]
        description: >
          Unique per event, assigned by the sender. The dashboard ignores an event_id it has already accepted
          (still answers 202), so a sender may retry safely (Q-11 default).
        $ref: "#/$defs/EventId"
      type:
        description: Event type name; fixed by each event type below.
        type: string
      schema_version:
        description: Version of this event type's shape, an integer starting at 1 (Q-12 default).
        type: integer
        minimum: 1
      occurred_at:
        x-assumed: [Q-11]
        description: >
          When the event happened at the sender. Events may arrive out of order; the dashboard orders by this
          field (Q-11 default).
        $ref: "#/$defs/Timestamp"
      source:
        description: The service that sent the event; fixed by each event type below.
        type: string
        enum: [pipeline-runner, artifact-store, release-service]
      data:
        description: Event-specific payload; fixed by each event type below.
        type: object
    examples:
      - event_id: 0b7f3a52-9c1d-4e8a-8f43-2d6c1b9e7a01
        type: build.started
        schema_version: 1
        occurred_at: "2026-11-25T10:00:00Z"
        source: pipeline-runner
        data:
          build_id: 5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701
          pipeline_name: shipyard-api

  # ---------------------------------------------------------------- event types

  BuildStarted:
    description: >
      A run's first step started. Sent by pipeline-runner. `occurred_at` is that step's `started_at` (not the
      run's `created_at`, which is when the runner accepted the run).
    allOf:
      - $ref: "#/$defs/Envelope"
      - type: object
        properties:
          type:
            const: build.started
          source:
            const: pipeline-runner
          schema_version:
            const: 1
          data:
            $ref: "#/$defs/BuildStartedData"
    unevaluatedProperties: false
    examples:
      - event_id: 0b7f3a52-9c1d-4e8a-8f43-2d6c1b9e7a01
        type: build.started
        schema_version: 1
        occurred_at: "2026-11-25T10:00:00Z"
        source: pipeline-runner
        data:
          build_id: 5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701
          pipeline_name: shipyard-api

  BuildFinished:
    x-assumed: [Q-13]
    description: >
      A run ended. One event for both outcomes, with `data.outcome` passed or failed (Q-13 default). Sent by
      pipeline-runner. `occurred_at` is the run's `finished_at`: the failed step's `finished_at` when a step
      failed, otherwise the moment the fake upload ended, because the build is marked passed or failed only
      after the upload (user decision, #120). Sent after that upload, never before it. When an unexpected
      runner error ends the run (`failure_reason` `internal error`, user decision, Q-41, #167), `occurred_at` is
      when the run was marked failed, and build.started may be missing if the error came before the first step.
    allOf:
      - $ref: "#/$defs/Envelope"
      - type: object
        properties:
          type:
            const: build.finished
          source:
            const: pipeline-runner
          schema_version:
            const: 1
          data:
            $ref: "#/$defs/BuildFinishedData"
    unevaluatedProperties: false
    examples:
      - event_id: 6a1e9d24-73b5-4f0c-a8e2-9b4d5c6f7a02
        type: build.finished
        schema_version: 1
        occurred_at: "2026-11-25T10:04:31Z"
        source: pipeline-runner
        data:
          build_id: 5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701
          pipeline_name: shipyard-api
          outcome: passed
          failed_step: null
          failure_reason: null
          steps:
            - name: install
              status: passed
              started_at: "2026-11-25T10:00:00Z"
              finished_at: "2026-11-25T10:01:30Z"
            - name: test
              status: passed
              started_at: "2026-11-25T10:01:30Z"
              finished_at: "2026-11-25T10:04:12Z"
      - event_id: 8c2f4e6a-1b3d-4a5c-9e7f-0a1b2c3d4e03
        type: build.finished
        schema_version: 1
        occurred_at: "2026-11-25T11:02:05Z"
        source: pipeline-runner
        data:
          build_id: 9e8d7c6b-5a49-4382-a716-05f4e3d2c104
          pipeline_name: shipyard-api
          outcome: failed
          failed_step: test
          failure_reason: null
          steps:
            - name: install
              status: passed
              started_at: "2026-11-25T11:00:00Z"
              finished_at: "2026-11-25T11:01:10Z"
            - name: test
              status: failed
              started_at: "2026-11-25T11:01:10Z"
              finished_at: "2026-11-25T11:02:05Z"
            - name: package
              status: skipped
              started_at: null
              finished_at: null
      - event_id: 5b7d9f1a-3c5e-4a7b-8d9f-1a3c5e7b9d13
        type: build.finished
        schema_version: 1
        occurred_at: "2026-11-25T13:01:07Z"
        source: pipeline-runner
        data:
          build_id: 2c4e6a8b-1d3f-4b5a-9c7e-0f2a4c6e8b12
          pipeline_name: shipyard-api
          outcome: failed
          failed_step: null
          failure_reason: internal error
          steps:
            - name: install
              status: passed
              started_at: "2026-11-25T13:00:00Z"
              finished_at: "2026-11-25T13:01:00Z"
            - name: test
              status: failed
              started_at: "2026-11-25T13:01:00Z"
              finished_at: "2026-11-25T13:01:07Z"
            - name: package
              status: skipped
              started_at: null
              finished_at: null

  ArtifactUploaded:
    description: >
      artifact-store stored a new artifact version. Sent by artifact-store. `occurred_at` equals
      `data.uploaded_at`.
    allOf:
      - $ref: "#/$defs/Envelope"
      - type: object
        properties:
          type:
            const: artifact.uploaded
          source:
            const: artifact-store
          schema_version:
            const: 1
          data:
            $ref: "#/$defs/Artifact"
    unevaluatedProperties: false
    examples:
      - event_id: 1d2e3f40-5a6b-4c7d-8e9f-a0b1c2d3e405
        type: artifact.uploaded
        schema_version: 1
        occurred_at: "2026-11-25T10:04:30Z"
        source: artifact-store
        data:
          name: shipyard-api
          version: 3
          checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          size_bytes: 1048576
          build_id: 5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701
          uploaded_at: "2026-11-25T10:04:30Z"

  ReleaseRequested:
    description: >
      release-service recorded a new release request (status pending). Sent by release-service. `occurred_at`
      equals `data.requested_at`.
    allOf:
      - $ref: "#/$defs/Envelope"
      - type: object
        properties:
          type:
            const: release.requested
          source:
            const: release-service
          schema_version:
            const: 1
          data:
            $ref: "#/$defs/ReleaseRequestedData"
    unevaluatedProperties: false
    examples:
      - event_id: 2e3f4a5b-6c7d-4e8f-9a0b-1c2d3e4f5a06
        type: release.requested
        schema_version: 1
        occurred_at: "2026-11-25T10:10:00Z"
        source: release-service
        data:
          release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
          artifact:
            name: shipyard-api
            version: 3
          requested_by: sam
          requested_at: "2026-11-25T10:10:00Z"

  ReleaseDecided:
    x-assumed: [Q-13]
    description: >
      release-service recorded the approve or reject decision for a release. One event for both outcomes, with
      `data.decision` approved or rejected (Q-13 default). Sent by release-service. `occurred_at` equals
      `data.decided_at`.
    allOf:
      - $ref: "#/$defs/Envelope"
      - type: object
        properties:
          type:
            const: release.decided
          source:
            const: release-service
          schema_version:
            const: 1
          data:
            $ref: "#/$defs/ReleaseDecidedData"
    unevaluatedProperties: false
    examples:
      - event_id: 3f4a5b6c-7d8e-4f9a-8b1c-2d3e4f5a6b08
        type: release.decided
        schema_version: 1
        occurred_at: "2026-11-25T10:20:00Z"
        source: release-service
        data:
          release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
          artifact:
            name: shipyard-api
            version: 3
          decision: approved
          decided_by: dana
          decided_at: "2026-11-25T10:20:00Z"
      - event_id: 4a5b6c7d-8e9f-4a0b-9c2d-3e4f5a6b7c09
        type: release.decided
        schema_version: 1
        occurred_at: "2026-11-25T10:21:00Z"
        source: release-service
        data:
          release_id: 8c7b6a5d-4e3f-4b2a-9d0e-1f2a3b4c5d10
          artifact:
            name: shipyard-web
            version: 12
          decision: rejected
          decided_by: lee
          decided_at: "2026-11-25T10:21:00Z"

  # ---------------------------------------------------------------- event payloads (shared parts)

  BuildStartedData:
    type: object
    additionalProperties: false
    required: [build_id, pipeline_name]
    properties:
      build_id:
        $ref: "#/$defs/BuildId"
      pipeline_name:
        $ref: "#/$defs/PipelineName"
    examples:
      - build_id: 5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701
        pipeline_name: shipyard-api

  BuildFinishedData:
    x-assumed: [Q-20]
    description: >
      Payload of build.finished. The anyOf below is the state table the schema enforces, with four rows:
      outcome passed means `failed_step` and `failure_reason` are null and every step passed; outcome failed at
      a step means `failed_step` is a step name, `failure_reason` is null and exactly one step has status
      failed; outcome failed by the upload (user decision, #120) means `failed_step` is null, `failure_reason`
      is `artifact upload failed` and every step passed; outcome failed by an internal error (user decision,
      Q-41, #167) means `failed_step` is null, `failure_reason` is `internal error` and `steps` is
      InterruptedRunSteps (at most one step failed: the one that was running when the error happened). Not
      checkable in JSON Schema, but required: `failed_step` is the `name` of that failed step, the steps before
      it passed and the steps after it are skipped (the run stops at the first failed step, Q-20 default); in
      the internal-error row the same order holds around the failed step, or, without one, the passed steps
      come first and the skipped steps after them.
    type: object
    additionalProperties: false
    required: [build_id, pipeline_name, outcome, failed_step, failure_reason, steps]
    properties:
      build_id:
        $ref: "#/$defs/BuildId"
      pipeline_name:
        $ref: "#/$defs/PipelineName"
      outcome:
        $ref: "#/$defs/BuildOutcome"
      steps:
        description: >
          Result of every step of the definition, in definition order (user decision, Q-14, #31). In a finished run a step
          is only passed, failed or skipped.
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/StepResult"
          properties:
            status:
              enum: [passed, failed, skipped]
      failed_step:
        x-assumed: [Q-20]
        description: >
          Name of the step that failed by its own result; null when the outcome is passed, the upload failed or
          an internal error ended the run.
        anyOf:
          - $ref: "#/$defs/StepName"
          - type: "null"
      failure_reason:
        description: >
          Set only when the build failed without a step failing by its own result: `artifact upload failed`
          when the fake upload failed (user decision, #120), `internal error` when pipeline-runner hit an
          unexpected error (user decision, Q-41, #167); null otherwise. The upload reason text is the user's;
          the field name, its required and nullable shape and the FailureReason enum are the contract's choice.
        anyOf:
          - $ref: "#/$defs/FailureReason"
          - type: "null"
    anyOf:
      - properties:
          outcome:
            const: passed
          failed_step:
            type: "null"
          failure_reason:
            type: "null"
          steps:
            $ref: "#/$defs/PassedRunSteps"
      - properties:
          outcome:
            const: failed
          failed_step:
            $ref: "#/$defs/StepName"
          failure_reason:
            type: "null"
          steps:
            $ref: "#/$defs/FailedRunSteps"
      - properties:
          outcome:
            const: failed
          failed_step:
            type: "null"
          failure_reason:
            const: artifact upload failed
          steps:
            $ref: "#/$defs/PassedRunSteps"
      - properties:
          outcome:
            const: failed
          failed_step:
            type: "null"
          failure_reason:
            const: internal error
          steps:
            $ref: "#/$defs/InterruptedRunSteps"
    examples:
      - build_id: 4b3a2c1d-0e9f-4a8b-b7c6-d5e4f3a2b111
        pipeline_name: shipyard-api
        outcome: failed
        failed_step: null
        failure_reason: artifact upload failed
        steps:
          - name: install
            status: passed
            started_at: "2026-11-25T12:00:00Z"
            finished_at: "2026-11-25T12:01:00Z"
      - build_id: 9e8d7c6b-5a49-4382-a716-05f4e3d2c104
        pipeline_name: shipyard-api
        outcome: failed
        failed_step: test
        failure_reason: null
        steps:
          - name: install
            status: passed
            started_at: "2026-11-25T11:00:00Z"
            finished_at: "2026-11-25T11:01:10Z"
          - name: test
            status: failed
            started_at: "2026-11-25T11:01:10Z"
            finished_at: "2026-11-25T11:02:05Z"
          - name: package
            status: skipped
            started_at: null
            finished_at: null
      - build_id: 2c4e6a8b-1d3f-4b5a-9c7e-0f2a4c6e8b12
        pipeline_name: shipyard-api
        outcome: failed
        failed_step: null
        failure_reason: internal error
        steps:
          - name: install
            status: passed
            started_at: "2026-11-25T13:00:00Z"
            finished_at: "2026-11-25T13:01:00Z"
          - name: test
            status: failed
            started_at: "2026-11-25T13:01:00Z"
            finished_at: "2026-11-25T13:01:07Z"
          - name: package
            status: skipped
            started_at: null
            finished_at: null

  ReleaseRequestedData:
    description: >
      Payload of release.requested. `requested_by` is who requested the release, as sent in the request body
      (user decision, Q-30, #87: a free string like `decided_by`).
    type: object
    additionalProperties: false
    required: [release_id, artifact, requested_by, requested_at]
    properties:
      release_id:
        $ref: "#/$defs/ReleaseId"
      artifact:
        $ref: "#/$defs/ArtifactRef"
      requested_by:
        $ref: "#/$defs/Actor"
      requested_at:
        $ref: "#/$defs/Timestamp"
    examples:
      - release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
        artifact:
          name: shipyard-api
          version: 3
        requested_by: sam
        requested_at: "2026-11-25T10:10:00Z"

  ReleaseDecidedData:
    type: object
    additionalProperties: false
    required: [release_id, artifact, decision, decided_by, decided_at]
    properties:
      release_id:
        $ref: "#/$defs/ReleaseId"
      artifact:
        $ref: "#/$defs/ArtifactRef"
      decision:
        $ref: "#/$defs/Decision"
      decided_by:
        $ref: "#/$defs/Actor"
      decided_at:
        $ref: "#/$defs/Timestamp"
    examples:
      - release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
        artifact:
          name: shipyard-api
          version: 3
        decision: approved
        decided_by: dana
        decided_at: "2026-11-25T10:20:00Z"

  # ---------------------------------------------------------------- shared values (also used by api-*.yml)

  EventId:
    x-assumed: [Q-15]
    description: UUID string assigned by the sender (Q-15 default).
    type: string
    format: uuid
    examples: [0b7f3a52-9c1d-4e8a-8f43-2d6c1b9e7a01]

  BuildId:
    x-assumed: [Q-15]
    description: >
      ID of one pipeline run (one run is one build; user decision, Q-28, #85), a UUID string assigned by
      pipeline-runner (Q-15 default). The same name, `build_id`, is used in every file.
    type: string
    format: uuid
    examples: [5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701]

  ReleaseId:
    x-assumed: [Q-15]
    description: ID of one release request, a UUID string assigned by release-service (Q-15 default).
    type: string
    format: uuid
    examples: [7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07]

  Timestamp:
    x-assumed: [Q-15]
    description: >
      RFC 3339 date-time in UTC with the `Z` suffix (Q-15 default). No line break anywhere (`not` below, same
      guard as ArtifactName, issue #121): `Z$` alone would accept a value ending in `Z` and a newline.
    type: string
    format: date-time
    pattern: "Z$"
    not:
      description: No line break anywhere (Python `re` lets `$` match before a final newline; issue #121).
      pattern: "\n"
    examples: ["2026-11-25T10:00:00Z"]

  PipelineName:
    description: >
      The `name` of the pipeline definition the run was started with (user decision, Q-19, #34). Same rule as
      ArtifactName, by reference (user decision, #119: "Pipeline names use the same rule as artifact names
      (Q-29): letters, digits, . - _; starts with a letter or digit; 1-100 chars; case-sensitive. A bad name is
      rejected with 422 when the pipeline is created. No slugifying."), so the fake artifact of a passed build,
      named after the pipeline (user decision, Q-34, #110), always has a valid name. Must be rejected, for
      example: `my pipeline` (space), `a/b` (slash), `-x` and `.x` (first character), the empty string, any
      name of 101 characters, and a name followed by a newline.
    $ref: "#/$defs/ArtifactName"
    examples: [shipyard-api, Web_2.1, a, "0"]

  FailureReason:
    description: >
      Why a build failed when no step failed by its own result. Two values. `artifact upload failed` is the
      user's (user decision, #120: "The fake upload runs after the last step passes and before the build is
      marked passed. If the upload fails, the build is failed with reason "artifact upload failed". No retries
      in wave 2."). `internal error` follows the user decision on #167 (Q-41: an unexpected runner error marks
      the build failed, and the contract changes only if the failed state cannot carry a reason; with
      `artifact upload failed` as the only value it could not): pipeline-runner hit an unexpected error of its
      own at any stage (a step, the upload other than a non-201 answer, a network error or a timeout, or
      recording the final state). The text `internal error` is the contract's choice, after the
      `internal_error` error code of errors.yml: it names the runner as the cause and carries no exception
      text. A build that failed at a step has no reason (null; the step is in `failed_step`). The field name
      `failure_reason`, its required-and-nullable shape in Run, BuildFinishedData and BuildView, and this enum
      are the contract's choice, not part of either decision.
    type: string
    enum: [artifact upload failed, internal error]
    examples: [artifact upload failed, internal error]

  StepName:
    description: The `name` of a step in the pipeline definition (user decision, Q-19, #34).
    type: string
    minLength: 1
    examples: [test]

  BuildOutcome:
    x-assumed: [Q-13]
    description: Final result of a run (Q-13 default).
    type: string
    enum: [passed, failed]
    examples: [passed]

  StepStatus:
    x-assumed: [Q-20]
    description: >
      State of one step. `pending` = not started yet; `running`; `passed`; `failed`; `skipped` = never run
      because an earlier step failed (the run stops at the first failed step, Q-20 default). In a build.finished
      event only `passed`, `failed` and `skipped` occur.
    type: string
    enum: [pending, running, passed, failed, skipped]
    examples: [passed]

  StepResult:
    x-assumed: [Q-20]
    description: >
      Result of one step, used in build.finished (user decision, Q-14, #31) and in pipeline-runner's run resource (Q-20
      default). Both timestamps are always present and null means not yet (or never): pending and skipped steps
      have both null, a running step has `started_at` only, a passed or failed step has both. The anyOf
      enforces this.
    type: object
    additionalProperties: false
    required: [name, status, started_at, finished_at]
    properties:
      name:
        $ref: "#/$defs/StepName"
      status:
        $ref: "#/$defs/StepStatus"
      started_at:
        anyOf:
          - $ref: "#/$defs/Timestamp"
          - type: "null"
      finished_at:
        anyOf:
          - $ref: "#/$defs/Timestamp"
          - type: "null"
    anyOf:
      - properties:
          status:
            enum: [pending, skipped]
          started_at:
            type: "null"
          finished_at:
            type: "null"
      - properties:
          status:
            const: running
          started_at:
            $ref: "#/$defs/Timestamp"
          finished_at:
            type: "null"
      - properties:
          status:
            enum: [passed, failed]
          started_at:
            $ref: "#/$defs/Timestamp"
          finished_at:
            $ref: "#/$defs/Timestamp"
    examples:
      - name: test
        status: failed
        started_at: "2026-11-25T11:01:10Z"
        finished_at: "2026-11-25T11:02:05Z"
      - name: package
        status: skipped
        started_at: null
        finished_at: null
      - name: install
        status: running
        started_at: "2026-11-25T11:00:00Z"
        finished_at: null

  PassedRunSteps:
    x-assumed: [Q-20]
    description: >
      The steps of a run whose outcome is passed: at least one step, every step passed. The single definition
      used by build.finished (BuildFinishedData), pipeline-runner's Run and the dashboard's BuildView, so the
      three accept exactly the same step lists for a passed run.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/StepResult"
      properties:
        status:
          const: passed
    examples:
      - - name: install
          status: passed
          started_at: "2026-11-25T10:00:00Z"
          finished_at: "2026-11-25T10:01:30Z"

  FailedRunSteps:
    x-assumed: [Q-20]
    description: >
      The steps of a run whose outcome is failed: at least one step, each passed, failed or skipped, exactly
      one failed (the run stops at the first failed step, Q-20 default). Not checkable in JSON Schema, but
      required: the steps before the failed one passed and the steps after it are skipped. The single
      definition used by BuildFinishedData, Run and BuildView.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/StepResult"
      properties:
        status:
          enum: [passed, failed, skipped]
    contains:
      required: [status]
      properties:
        status:
          const: failed
    minContains: 1
    maxContains: 1
    examples:
      - - name: install
          status: passed
          started_at: "2026-11-25T11:00:00Z"
          finished_at: "2026-11-25T11:01:10Z"
        - name: test
          status: failed
          started_at: "2026-11-25T11:01:10Z"
          finished_at: "2026-11-25T11:02:05Z"
        - name: package
          status: skipped
          started_at: null
          finished_at: null

  InterruptedRunSteps:
    description: >
      The steps of a run that an unexpected pipeline-runner error ended (user decision, Q-41, #167: a crash is
      a failure; an unexpected error during a run marks the run failed with `internal error` and sends
      build.finished): at least one step, each passed, failed or skipped, at most one failed. The step that was running when the error happened, if any, is failed with `finished_at` set to
      when the run was marked failed; steps not started are skipped; passed steps stay passed. With no failed
      step the error happened between steps, during the upload or while the final state was recorded. Not
      checkable in JSON Schema, but required: the passed steps come first, then the failed one if any, then
      the skipped ones. The single definition used by BuildFinishedData, Run and BuildView.
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/StepResult"
      properties:
        status:
          enum: [passed, failed, skipped]
    contains:
      required: [status]
      properties:
        status:
          const: failed
    minContains: 0
    maxContains: 1
    examples:
      - - name: install
          status: passed
          started_at: "2026-11-25T13:00:00Z"
          finished_at: "2026-11-25T13:01:00Z"
        - name: test
          status: failed
          started_at: "2026-11-25T13:01:00Z"
          finished_at: "2026-11-25T13:01:07Z"
        - name: package
          status: skipped
          started_at: null
          finished_at: null
      - - name: install
          status: passed
          started_at: "2026-11-25T13:00:00Z"
          finished_at: "2026-11-25T13:01:00Z"

  ArtifactName:
    description: >
      Artifact name as chosen by the uploader; used as the `{name}` path segment in artifact-store (user
      decision, Q-29, #86): letters, digits, `.`, `-` and `_`; the first character is a letter or digit; 1 to
      100 characters; case-sensitive (`App` and `app` are two artifacts). No `/` and no spaces, so every valid
      name is one path segment (closes the gap of issue #103). Must be rejected, for example: `a/b` (slash),
      `my app` (space), the empty string, `-app` and `.app` (first character), and any name of 101 characters.
    type: string
    minLength: 1
    maxLength: 100
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"
    not:
      description: >
        No line break anywhere. Needed because in Python's `re` (used by jsonschema) `$` also matches before
        a final newline, so the pattern alone would accept `app` followed by a newline.
      pattern: "\n"
    examples: [shipyard-api, Web_2.1, a, "0"]

  ArtifactVersion:
    description: >
      Integer version assigned by artifact-store per artifact name, starting at 1 (user decision, Q-17, #33),
      and at most 2^63-1 = 9223372036854775807 (user decision, Q-40, #170: cap versions in the contract). Every
      operation that receives a version (artifact-store's `{version}` path parameter, release-service's request
      body, the dashboard's `POST /events`) answers a larger value with 422 validation_failed; artifact-store
      never assigns one.
    type: integer
    minimum: 1
    maximum: 9223372036854775807
    examples: [3, 9223372036854775807]

  Checksum:
    description: >
      SHA-256 of the artifact bytes as 64 lowercase hex characters, computed by artifact-store (user decision,
      Q-17, #33). No line break anywhere (`not` below, same guard as ArtifactName, issue #121): the pattern
      alone would accept 64 hex characters followed by a newline.
    type: string
    pattern: "^[0-9a-f]{64}$"
    not:
      description: No line break anywhere (Python `re` lets `$` match before a final newline; issue #121).
      pattern: "\n"
    examples: [9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08]

  ArtifactRef:
    description: Points at one stored artifact version by name + version (what a release references, user decision, Q-16, #32).
    type: object
    additionalProperties: false
    required: [name, version]
    properties:
      name:
        $ref: "#/$defs/ArtifactName"
      version:
        $ref: "#/$defs/ArtifactVersion"
    examples:
      - name: shipyard-api
        version: 3

  Artifact:
    description: >
      Metadata of one stored artifact version: the data of artifact.uploaded and the body artifact-store
      returns for an upload. `build_id` is the run it came from (user decision, Q-17, #33); artifact-store records it as
      sent and does not check it with pipeline-runner.
    type: object
    additionalProperties: false
    required: [name, version, checksum, size_bytes, build_id, uploaded_at]
    properties:
      name:
        $ref: "#/$defs/ArtifactName"
      version:
        $ref: "#/$defs/ArtifactVersion"
      checksum:
        $ref: "#/$defs/Checksum"
      size_bytes:
        x-assumed: [Q-18]
        description: Size of the stored bytes; at most 100 MiB (Q-18 default).
        type: integer
        minimum: 0
        maximum: 104857600
      build_id:
        $ref: "#/$defs/BuildId"
      uploaded_at:
        $ref: "#/$defs/Timestamp"
    examples:
      - name: shipyard-api
        version: 3
        checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        size_bytes: 1048576
        build_id: 5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701
        uploaded_at: "2026-11-25T10:04:30Z"

  Decision:
    x-assumed: [Q-13]
    description: An approve or reject decision on a release (Q-13 default).
    type: string
    enum: [approved, rejected]
    examples: [approved]

  Actor:
    description: >
      Who made a decision (`decided_by`) or requested a release (`requested_by`, user decision, Q-30, #87), as a
      free non-empty string sent by the caller. There is no authentication in waves 1-2 (user decision, Q-09,
      #29), so release-service records the value as sent and does not verify it (user decision, Q-10, #30).
    type: string
    minLength: 1
    examples: [dana]

oneOf:
  - $ref: "#/$defs/BuildStarted"
  - $ref: "#/$defs/BuildFinished"
  - $ref: "#/$defs/ArtifactUploaded"
  - $ref: "#/$defs/ReleaseRequested"
  - $ref: "#/$defs/ReleaseDecided"
