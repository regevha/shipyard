summary: >
  Wave 2d, the last wave 2 task; runs alone after T021-T027 are merged, so wave 2 ends demo-ready. Stack-level
  HTTP tests in stack-tests/tests/ (never e2e/): a session fixture in stack-tests/tests/conftest.py runs
  scripts/dev/start-stack.sh for SHIPYARD_SLOT (required, never defaulted to 0 inside a worktree) and
  stop-stack.sh at the end; URLs from scripts/dev/ports.sh. Flow (test_passed_build_upload_release_approve_promote):
  POST /runs on pipeline-runner (name shipyard-api, steps that pass), poll GET /runs/{build_id} (Q-28) until
  passed; GET the artifact shipyard-api version 1 from artifact-store and check the bytes against
  X-Checksum-SHA256 (Q-34: one artifact named after the pipeline); POST /releases with requested_by (Q-30),
  approve with decided_by, promote (200), promote again (200 unchanged, Q-31); the dashboard's GET /builds,
  /artifacts and /releases show the build passed, the artifact, and the release approved with requested_by and
  decided_by, without a promotion field (Q-14). Also: a step with command exactly "fail" fails the build,
  nothing is uploaded and it shows under /builds?status=failed (Q-33, Q-34); a bad pipeline name is 422 (#119);
  a rejected release is 409 on promote (Q-16); GET / on the dashboard is HTML (T027); every JSON response
  validates against its contract schema (jsonschema, refs resolved from contracts/). In its own module, after
  the main flow: stop artifact-store (its pid file), run a passing pipeline and expect failed with failed_step
  null and failure_reason "artifact upload failed" (Q-36, #120, no retry). Add the CI job `stack` to
  .github/workflows/ci.yml (same pinned checkout and setup-uv as T021's `service` job; uv sync --locked in
  stack-tests; pytest), in ci-ok's needs; do not change the other jobs. Write docs/DEMO.md with exactly the
  sections "## Run it" (one command: scripts/dev/start-stack.sh, then open the dashboard URL; stop-stack.sh),
  "## Walkthrough" (about five minutes, one ```sh block runnable with bash -euo pipefail for a given
  SHIPYARD_SLOT, using curl and python3 only: start the stack, run a passing and a failing pipeline, show the
  artifact, request, approve and promote a release, read the dashboard API, with what to look at in the browser
  between steps), and "## Known limitations" (no auth between services, Q-09; SQLite data is throw-away and
  wiped on start; steps are simulated, Q-19, Q-33; one fake artifact per passed build, Q-34; no retries of the
  upload, Q-36; events are plain HTTP, no queue, Q-27; no buttons and no promotion on the dashboard, Q-32, Q-14;
  a failed build can still show an artifact, #131, assumed option (a)). If a stack test finds a defect in a
  service, report it to the lead with the failing test; never fix service code here. Hand-off docs/tasks/T028.md.
