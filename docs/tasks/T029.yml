summary: >
  Architect task after wave 2 closed. Records the project owner's decisions of 2026-11-27 08:42 Asia/Jerusalem (#163, #170, #167,
  #171, #177; confirmed in the lead session, recorded by the lead on the issues) as Q-39..Q-43. Contract changes
  between waves: ArtifactVersion maximum 2^63-1 with 422 for larger values (#170, Q-40); FailureReason gets
  internal error, a new InterruptedRunSteps and a fourth state row in BuildFinishedData, Run and BuildView
  (#167, Q-41, whose condition is met). No contract change for #163 (wave 3) or #171 (convention change: 5 s
  total deadline, async sender). PLAN.md: the follow-up groups F1 (T030-T032), F2 (T033), F3 (T034), the wave 3
  outline per #177, the event-sender convention, task rows and contract change requests. Specs T030-T034. No code.
