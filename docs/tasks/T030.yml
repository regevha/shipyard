summary: >
  Group F1 of the wave 2 follow-ups, runs in parallel with T031 and T032. Implements the T029 contract changes in
  the dashboard; no contract change here (contracts frozen). (1) Q-40, #170 (the project owner, 2026-11-27: cap
  versions in the contract): an artifact version above 9223372036854775807 (2^63-1) in artifact.uploaded,
  release.requested or release.decided is 422 validation_failed (today 500 from a SQLite overflow), with a
  `details` location such as body.data.version or body.data.artifact.version; nothing is stored. 2^63-1 itself is
  accepted (202) and read back exactly from GET /artifacts and GET /releases. Tests at 2^63-1 and 2^63 (also 2^200)
  for each of the three event types. (2) Q-41, #167: build.finished with outcome failed, failed_step null and
  failure_reason "internal error" is valid when steps match events.yml InterruptedRunSteps (each passed, failed or
  skipped, at most one failed; passed steps first, then the failed one if any, then skipped ones); intake accepts
  it (202) and GET /builds?status=failed lists it with failure_reason internal error. Cases to accept: one failed
  step after passed ones with skipped ones after it; no failed step (passed then skipped); every step skipped.
  Cases that are 422: internal error with failed_step set; two failed steps; a running or pending step; a passed
  step after the failed or a skipped one; internal error with outcome passed; "artifact upload failed" with any
  step not passed (test_upload_reason_row_still_requires_every_step_passed: the upload row now requires exactly
  that text and every step passed). app/repos/views.py today maps any stored reason to "artifact upload failed";
  store and return the reason as received. Every response in the new tests validates against the contract
  schemas (BuildView, ArtifactPage, ReleasePage). Update DATA_MODEL.md if a column changes. Do not touch
  static/ (app.js already shows failure_reason as text), pyproject.toml, uv.lock or the T022 copies. Hand-off
  docs/tasks/T030.md.
