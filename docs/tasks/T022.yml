summary: >
  Wave 2a, second task; starts after T021 is merged and runs alone. Writes the canonical modules and their tests
  under shared/, then copies each file verbatim (byte-identical) to every service as mapped by
  scripts/ci/check_shared_copy.py. shared/ is never run in place: the tests import `app.errors` and
  `openapi_conformance` as they are laid out in a service, and run in all four services. Find the repo root by
  walking up from __file__ to the first directory that holds contracts/errors.yml (the copies sit at a different
  depth than shared/). (1) shared/errors.py (Q-21): pydantic models ErrorDetail and ErrorEnvelope mirroring
  contracts/errors.yml#/$defs/ErrorEnvelope, ErrorCode as a Literal of its enum; ApiError(status, code, message,
  details=None); handlers: ApiError as given; RequestValidationError (including a body that is not valid JSON)
  -> 422 validation_failed with details, location = the error loc joined by dots (body.steps.0.name,
  path.name, query.build_id, header.x-checksum-sha256); Starlette HTTPException 404 -> not_found, 405 ->
  method_not_allowed with exc.headers passed through (Allow kept), 413 -> payload_too_large; any other 4xx ->
  422 validation_failed and any other 5xx -> 500 internal_error (#136, decided in T020: errors.yml x-status-codes
  pairs validation_failed only with 422 and internal_error only with 500; no contract change); any unhandled
  exception -> 500 internal_error with no internals in the message. install(app) registers the handlers and
  replaces app.openapi so that HTTPValidationError and ValidationError are gone, ErrorEnvelope is a component,
  every operation has 422 and 500 with the envelope (application/json only), and every 4xx/5xx a route declares
  in `responses=` gets the envelope as its only content. A test checks that the (status, code) pairs ApiError
  accepts equal errors.yml x-status-codes. (2) shared/openapi_conformance.py (Q-22): differences(app_spec,
  contract_path) -> list[str], one readable line per difference, every difference not only the first, empty if
  they conform. Compares: the set of paths and methods; per operation the status codes, the media types of
  request and response bodies, and the parameters (name, in, required); per JSON body, after resolving every
  $ref (local and cross-file, e.g. events.yml#/$defs/..., errors.yml#/$defs/..., read from disk only) and
  ignoring annotations (title, description, examples, default, x-*): the property paths with their required
  flag and JSON types (null included; anyOf/oneOf branches merged), and every example the contract gives for that
  body (media-type examples and schema examples) must validate against the app's schema. Pydantic's schema
  form (anyOf with null, its own names) is not compared literally. Also schema_validator(contract_path, pointer)
  -> a jsonschema Draft 2020-12 validator for a contract schema (e.g. "#/components/schemas/Run"), so service
  tests validate real responses against the contract, state tables (anyOf/oneOf) included. Whatever extra
  normalisation you need goes in the hand-off. (3) Tests: the named tests in acceptance, built on small FastAPI
  apps and small contracts written to tmp_path, plus the real contracts/errors.yml. Coverage of app/errors.py
  must reach fail_under in every service. Uses only the dependencies T021 installed (fastapi, httpx, pyyaml,
  jsonschema); if anything else is needed, stop and report blocked. Never edit app/main.py, pyproject.toml or
  uv.lock (owned by the service tasks). Hand-off docs/tasks/T022.md: the public functions with signatures, how
  a service calls install(app) and writes tests/test_contract_conformance.py (a five-line example), and the
  normalisation rules.
