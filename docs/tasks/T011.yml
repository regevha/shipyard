summary: >
  New workflow .github/workflows/ci.yml, triggered on pull_request and on push to main, with a contracts job
  (pip install -r scripts/ci/requirements-contracts.txt, which pins pyyaml, jsonschema[format-nongpl] and
  openapi-spec-validator to exact versions; run --self-test, then the check) and an aggregate job whose check-run name is exactly ci-ok (needs every other ci.yml job, if: always(),
  fails unless all succeeded). Implements docs/PLAN.md "Contract file format" exactly, including the task-spec
  parse check; anything unclear there goes to the lead, not a guess. Pin third-party GitHub Actions by commit SHA
  and pip packages to exact versions; least-privilege permissions (contents: read). Do not edit
  .github/workflows/team-checks.yml (synced from the shared core; see docs/OPEN_QUESTIONS.md Q-06): ci-ok
  cannot need its jobs. Making ci-ok a required check is a branch-protection setting for the user or lead, not
  this task.
