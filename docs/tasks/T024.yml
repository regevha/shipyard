summary: >
  Wave 2b, runs in parallel with T023 and T025. Implements contracts/api-pipeline-runner.yml exactly. One run is
  one build (Q-28, #85): build_id everywhere, paths /runs and /runs/{build_id}. POST /runs validates the
  definition {name, steps: [{name, command}]} (Q-19), answers 202 with the Run at once and runs the steps in the
  background in order, stopping at the first failed step (Q-20 default). Pipeline names use the artifact-name
  rule (#119, Q-35): a bad name (my pipeline, a/b, -x, .x, empty, 101 characters, a trailing newline) is 422
  validation_failed and no run is created; no slugifying. Steps are simulated, commands never executed (Q-19):
  a step whose command is exactly "fail" fails, anything else passes, string equality, so FAIL, " fail" and
  "fail now" pass (Q-33, #107). build.started when the first step starts. When every step passed (Q-34, #110;
  Q-36, #120): exactly one upload attempt, while the run is still running, of one fake artifact named after the
  pipeline, POST {ARTIFACT_STORE_URL}/artifacts/{pipeline_name}?build_id=<build_id> with placeholder bytes (and
  their SHA-256 in X-Checksum-SHA256); on 201 the run becomes passed, then build.finished (passed); on anything
  else (non-201, network error, timeout) the run becomes failed with failed_step null and failure_reason
  "artifact upload failed", then build.finished (failed); no retry. A build with a failed step uploads nothing
  and sends build.finished at once. #132: you pick the upload timeout (an env var
  PIPELINE_RUNNER_UPLOAD_TIMEOUT_SECONDS with a default you choose, e.g. 10) and record it in the hand-off as
  "upload timeout: <n> s" with the reason. assumed (#131): option (a), nothing extra when a timeout leaves a
  stored artifact; option (c) would not change this task. Simulated step duration: an env var
  PIPELINE_RUNNER_STEP_SECONDS (default 0.5, tests set 0) so a running build is visible in the demo. Events
  follow PLAN.md § Conventions (event sender, after commit, never changes the outcome); URLs from
  ARTIFACT_STORE_URL and DASHBOARD_URL. Tests fake artifact-store and the dashboard with httpx.MockTransport
  (record call order to prove upload-before-build.finished and exactly one attempt). app/main.py: install(app),
  routers, create_all at startup (PIPELINE_RUNNER_DATABASE_URL). All SQL in app/repos/. Never edit the T022
  copies. Write services/pipeline-runner/DATA_MODEL.md and the hand-off docs/tasks/T024.md (endpoints, env
  vars, upload timeout, step duration).
