summary: >
  Wave 2b, runs in parallel with T024 and T025. Implements contracts/api-dashboard.yml exactly: POST /events
  (body = any one valid event of contracts/events.yml; 202; 422 validation_failed for anything else, including
  an unknown type, a source that does not match the type, an unknown field and a value with a trailing newline,
  #121; a repeated event_id is 202 and the first accepted body wins, Q-11 default) and GET /builds (status
  filter, status=failed is the failures view), GET /artifacts, GET /releases, each with limit (1-200, default 50)
  and offset (default 0), newest first by the occurred_at of the latest event per item as the operation
  descriptions say. Views follow the contract's rules: a field whose event has not arrived is present and null,
  a list is []; events may arrive out of order (build.finished before build.started, release.decided before
  release.requested, artifact.uploaded before build.finished, user decision #120). BuildView carries
  failure_reason (artifact upload failed, #120) and ReleaseView requested_by (Q-30, null until
  release.requested arrives). No promotion field (Q-14, Q-31). Read-only (Q-23, Q-32): no write endpoint besides
  POST /events, no approve, reject or promote, the dashboard calls no other service. assumed (#131): option (a),
  /artifacts lists every uploaded artifact, also one whose build failed; under option (c) this task's /artifacts
  (and maybe api-dashboard.yml) would change. app/main.py: install(app) from app/errors.py (T022), the routers,
  create_all at startup (app/repos/engine.py reads DASHBOARD_DATABASE_URL with the default under
  SHIPYARD_DATA_DIR, environment.md SQLite file row), then the UI without breaking the framework's
  404/405 routing (review B2: a StaticFiles(html=True) mount at / swallows every path, so GET /events became 404
  instead of 405 with Allow: POST, and POST /nope became 405 instead of 404): a GET route / (include_in_schema
  False) answering static/index.html as text/html, and StaticFiles(directory=<services/dashboard/static>)
  mounted at /static for app.js and style.css; nothing is mounted at /. A wrong method on a static file is
  405 method_not_allowed with Allow: GET, HEAD (subclass StaticFiles if Starlette omits the header). The
  static tests check status codes, content types and envelopes only, never the placeholder's content, so T027
  can replace index.html without editing them. Never edit static/ (frontend-dev, T027) or the T022 copies
  (app/errors.py, tests/openapi_conformance.py, tests/test_shared_*.py). All SQL in app/repos/. Tests use an
  in-memory SQLite URL with StaticPool; tests/test_contract_conformance.py asserts
  differences(app.openapi(), contracts/api-dashboard.yml) == []; every response in the read-API tests is
  validated with schema_validator against the contract schemas (BuildPage, ArtifactPage, ReleasePage, state
  tables included). Write services/dashboard/DATA_MODEL.md (tables, keys, how views are derived from events)
  and the hand-off docs/tasks/T023.md (endpoints, how T027 and T028 can seed events with curl, anything about
  ordering).
