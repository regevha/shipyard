  - |-
    python3 -c "
    from jsonschema import Draft202012Validator
    from referencing import Registry, Resource
    from referencing.jsonschema import DRAFT202012
    import yaml
    B = 'https://shipyard.invalid/contracts/'
    reg = Registry().with_resources((B + f, Resource.from_contents(yaml.safe_load(open('contracts/' + f)), default_specification=DRAFT202012)) for f in ['events.yml', 'errors.yml', 'api-pipeline-runner.yml', 'api-dashboard.yml', 'api-release-service.yml', 'api-artifact-store.yml'])
    ok = lambda u, v: Draft202012Validator({'\$ref': B + u}, registry=reg).is_valid(v)
    T = '2026-11-25T13:00:00Z'; s = lambda n, st, a=None, b=None: {'name': n, 'status': st, 'started_at': a, 'finished_at': b}
    d = {'build_id': '2c4e6a8b-1d3f-4b5a-9c7e-0f2a4c6e8b12', 'pipeline_name': 'p', 'outcome': 'failed', 'failed_step': None, 'failure_reason': 'internal error', 'steps': [s('a', 'passed', T, T), s('b', 'failed', T, T), s('c', 'skipped')]}
    F = 'events.yml#/\$defs/BuildFinishedData'
    assert ok(F, d) and ok(F, {**d, 'steps': [s('a', 'skipped')]})
    assert not ok(F, {**d, 'failed_step': 'b'}) and not ok(F, {**d, 'steps': [s('a', 'failed', T, T), s('b', 'failed', T, T)]})
    assert not ok(F, {**d, 'steps': [s('a', 'running', T)]}) and not ok(F, {**d, 'failure_reason': 'artifact upload failed'})
    R = 'api-release-service.yml#/components/schemas/ReleaseRequest'
    assert ok(R, {'artifact': {'name': 'a', 'version': 2**63 - 1}, 'requested_by': 's'}) and not ok(R, {'artifact': {'name': 'a', 'version': 2**63}, 'requested_by': 's'})
    print('rules behave')"  # prints rules behave (with scripts/ci/requirements-contracts.txt installed)
