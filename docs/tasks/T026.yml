summary: >
  Wave 2c, runs in parallel with T027. Implements contracts/api-release-service.yml exactly. POST /releases
  takes an artifact reference (name + version, Q-16) and requested_by, a required non-empty free string (Q-30,
  #87); the server sets requested_at; 201 with status pending; release-service does not check that the artifact
  exists (Q-16, #32) and never calls artifact-store. POST /releases/{release_id}/decision records approve or
  reject with decided_by as sent and decided_at set by the server; one decision per release, final: a second is
  409 release_already_decided; a rejected release stays rejected; no self-approval rule (Q-10, #30). POST
  /releases/{release_id}/promote records promoted_at only when the release is approved, else 409
  release_not_approved (Q-16, #32); promoting an already promoted release is 200 with the release unchanged,
  promoted_at keeps the first time (Q-31, #88). Error precedence as the contract says: 422 for a malformed path
  parameter, then 404, then 422 for the body (decision only), then 409. Decide and promote are called by any
  client directly on release-service, never through the dashboard (Q-32, #89); nothing in this service assumes a
  dashboard caller. Events per PLAN.md § Conventions: release.requested after a release is created,
  release.decided after a decision, none for a promotion (Q-14, #31); DASHBOARD_URL. app/main.py: install(app),
  routers, create_all at startup (RELEASE_SERVICE_DATABASE_URL). All SQL in app/repos/. Tests fake the dashboard
  with httpx.MockTransport and fail on any other host. Never edit the T022 copies. Write
  services/release-service/DATA_MODEL.md and the hand-off docs/tasks/T026.md (endpoints, curl examples for
  request, approve, promote, used by T028 and docs/DEMO.md).
