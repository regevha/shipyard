$schema: https://json-schema.org/draft/2020-12/schema
$id: https://shipyard.invalid/contracts/events.yml
title: Shipyard events
description: >
  Events that pipeline-runner, artifact-store and release-service POST to the dashboard's events endpoint
  (`POST /events` in api-dashboard.yml, whose request body is this file's root schema). The root schema is
  "any valid event": exactly one of the five event types below. Every event type is the shared Envelope plus a
  fixed `type`, `source` and `schema_version` and a closed `data` object. The shared value schemas at the end
  (BuildId, ReleaseId, Timestamp, Artifact, ArtifactRef, StepResult, ...) are the single definition of those
  concepts; the four api-*.yml files refer to them instead of redefining them.
$defs:

  # ---------------------------------------------------------------- envelope (shared part)

  Envelope:
    x-assumed: [Q-12]
    description: >
      Common shape of every event (Q-12 default). An open allOf member: each event type composes it and closes
      the result with unevaluatedProperties: false.
    type: object
    required: [event_id, type, schema_version, occurred_at, source, data]
    properties:
      event_id:
        x-assumed: [Q-11, Q-15]
        description: >
          Unique per event, assigned by the sender. The dashboard ignores an event_id it has already accepted
          (still answers 202), so a sender may retry safely (Q-11 default).
        $ref: "#/$defs/EventId"
      type:
        description: Event type name; fixed by each event type below.
        type: string
      schema_version:
        description: Version of this event type's shape, an integer starting at 1 (Q-12 default).
        type: integer
        minimum: 1
      occurred_at:
        x-assumed: [Q-11]
        description: >
          When the event happened at the sender. Events may arrive out of order; the dashboard orders by this
          field (Q-11 default).
        $ref: "#/$defs/Timestamp"
      source:
        description: The service that sent the event; fixed by each event type below.
        type: string
        enum: [pipeline-runner, artifact-store, release-service]
      data:
        description: Event-specific payload; fixed by each event type below.
        type: object
    examples:
      - event_id: 0b7f3a52-9c1d-4e8a-8f43-2d6c1b9e7a01
        type: build.started
        schema_version: 1
        occurred_at: "2026-11-25T10:00:00Z"
        source: pipeline-runner
        data:
          build_id: 5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701
          pipeline_name: shipyard-api

  # ---------------------------------------------------------------- event types

  BuildStarted:
    description: The pipeline-runner accepted a run and started its first step. Sent by pipeline-runner.
    allOf:
      - $ref: "#/$defs/Envelope"
      - type: object
        properties:
          type:
            const: build.started
          source:
            const: pipeline-runner
          schema_version:
            const: 1
          data:
            $ref: "#/$defs/BuildStartedData"
    unevaluatedProperties: false
    examples:
      - event_id: 0b7f3a52-9c1d-4e8a-8f43-2d6c1b9e7a01
        type: build.started
        schema_version: 1
        occurred_at: "2026-11-25T10:00:00Z"
        source: pipeline-runner
        data:
          build_id: 5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701
          pipeline_name: shipyard-api

  BuildFinished:
    x-assumed: [Q-13]
    description: >
      A run ended. One event for both outcomes, with `data.outcome` passed or failed (Q-13 default). Sent by
      pipeline-runner.
    allOf:
      - $ref: "#/$defs/Envelope"
      - type: object
        properties:
          type:
            const: build.finished
          source:
            const: pipeline-runner
          schema_version:
            const: 1
          data:
            $ref: "#/$defs/BuildFinishedData"
    unevaluatedProperties: false
    examples:
      - event_id: 6a1e9d24-73b5-4f0c-a8e2-9b4d5c6f7a02
        type: build.finished
        schema_version: 1
        occurred_at: "2026-11-25T10:04:12Z"
        source: pipeline-runner
        data:
          build_id: 5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701
          pipeline_name: shipyard-api
          outcome: passed
          steps:
            - name: install
              status: passed
              started_at: "2026-11-25T10:00:00Z"
              finished_at: "2026-11-25T10:01:30Z"
            - name: test
              status: passed
              started_at: "2026-11-25T10:01:30Z"
              finished_at: "2026-11-25T10:04:12Z"
      - event_id: 8c2f4e6a-1b3d-4a5c-9e7f-0a1b2c3d4e03
        type: build.finished
        schema_version: 1
        occurred_at: "2026-11-25T11:02:05Z"
        source: pipeline-runner
        data:
          build_id: 9e8d7c6b-5a49-4382-a716-05f4e3d2c104
          pipeline_name: shipyard-api
          outcome: failed
          failed_step: test
          steps:
            - name: install
              status: passed
              started_at: "2026-11-25T11:00:00Z"
              finished_at: "2026-11-25T11:01:10Z"
            - name: test
              status: failed
              started_at: "2026-11-25T11:01:10Z"
              finished_at: "2026-11-25T11:02:05Z"
            - name: package
              status: skipped

  ArtifactUploaded:
    description: artifact-store stored a new artifact version. Sent by artifact-store.
    allOf:
      - $ref: "#/$defs/Envelope"
      - type: object
        properties:
          type:
            const: artifact.uploaded
          source:
            const: artifact-store
          schema_version:
            const: 1
          data:
            $ref: "#/$defs/Artifact"
    unevaluatedProperties: false
    examples:
      - event_id: 1d2e3f40-5a6b-4c7d-8e9f-a0b1c2d3e405
        type: artifact.uploaded
        schema_version: 1
        occurred_at: "2026-11-25T10:04:30Z"
        source: artifact-store
        data:
          name: shipyard-api
          version: 3
          checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          size_bytes: 1048576
          build_id: 5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701
          uploaded_at: "2026-11-25T10:04:30Z"

  ReleaseRequested:
    description: release-service recorded a new release request (status pending). Sent by release-service.
    allOf:
      - $ref: "#/$defs/Envelope"
      - type: object
        properties:
          type:
            const: release.requested
          source:
            const: release-service
          schema_version:
            const: 1
          data:
            $ref: "#/$defs/ReleaseRequestedData"
    unevaluatedProperties: false
    examples:
      - event_id: 2e3f4a5b-6c7d-4e8f-9a0b-1c2d3e4f5a06
        type: release.requested
        schema_version: 1
        occurred_at: "2026-11-25T10:10:00Z"
        source: release-service
        data:
          release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
          artifact:
            name: shipyard-api
            version: 3
          requested_at: "2026-11-25T10:10:00Z"

  ReleaseDecided:
    x-assumed: [Q-13]
    description: >
      release-service recorded the approve or reject decision for a release. One event for both outcomes, with
      `data.decision` approved or rejected (Q-13 default). Sent by release-service.
    allOf:
      - $ref: "#/$defs/Envelope"
      - type: object
        properties:
          type:
            const: release.decided
          source:
            const: release-service
          schema_version:
            const: 1
          data:
            $ref: "#/$defs/ReleaseDecidedData"
    unevaluatedProperties: false
    examples:
      - event_id: 3f4a5b6c-7d8e-4f9a-8b1c-2d3e4f5a6b08
        type: release.decided
        schema_version: 1
        occurred_at: "2026-11-25T10:20:00Z"
        source: release-service
        data:
          release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
          artifact:
            name: shipyard-api
            version: 3
          decision: approved
          decided_by: dana
          decided_at: "2026-11-25T10:20:00Z"
      - event_id: 4a5b6c7d-8e9f-4a0b-9c2d-3e4f5a6b7c09
        type: release.decided
        schema_version: 1
        occurred_at: "2026-11-25T10:21:00Z"
        source: release-service
        data:
          release_id: 8c7b6a5d-4e3f-4b2a-9d0e-1f2a3b4c5d10
          artifact:
            name: shipyard-web
            version: 12
          decision: rejected
          decided_by: lee
          decided_at: "2026-11-25T10:21:00Z"

  # ---------------------------------------------------------------- event payloads (shared parts)

  BuildStartedData:
    type: object
    additionalProperties: false
    required: [build_id, pipeline_name]
    properties:
      build_id:
        $ref: "#/$defs/BuildId"
      pipeline_name:
        $ref: "#/$defs/PipelineName"
    examples:
      - build_id: 5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701
        pipeline_name: shipyard-api

  BuildFinishedData:
    type: object
    additionalProperties: false
    required: [build_id, pipeline_name, outcome, steps]
    properties:
      build_id:
        $ref: "#/$defs/BuildId"
      pipeline_name:
        $ref: "#/$defs/PipelineName"
      outcome:
        $ref: "#/$defs/BuildOutcome"
      steps:
        x-assumed: [Q-14]
        description: Result of every step of the definition, in definition order (Q-14 default).
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/StepResult"
      failed_step:
        x-assumed: [Q-14, Q-20]
        description: >
          Name of the step that failed. Present exactly when outcome is failed; the run stops at the first failed
          step (Q-20 default), so there is at most one.
        $ref: "#/$defs/StepName"
    if:
      required: [outcome]
      properties:
        outcome:
          const: failed
    then:
      required: [failed_step]
    else:
      not:
        required: [failed_step]
    examples:
      - build_id: 9e8d7c6b-5a49-4382-a716-05f4e3d2c104
        pipeline_name: shipyard-api
        outcome: failed
        failed_step: test
        steps:
          - name: install
            status: passed
            started_at: "2026-11-25T11:00:00Z"
            finished_at: "2026-11-25T11:01:10Z"
          - name: test
            status: failed
            started_at: "2026-11-25T11:01:10Z"
            finished_at: "2026-11-25T11:02:05Z"
          - name: package
            status: skipped

  ReleaseRequestedData:
    type: object
    additionalProperties: false
    required: [release_id, artifact, requested_at]
    properties:
      release_id:
        $ref: "#/$defs/ReleaseId"
      artifact:
        $ref: "#/$defs/ArtifactRef"
      requested_at:
        $ref: "#/$defs/Timestamp"
    examples:
      - release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
        artifact:
          name: shipyard-api
          version: 3
        requested_at: "2026-11-25T10:10:00Z"

  ReleaseDecidedData:
    type: object
    additionalProperties: false
    required: [release_id, artifact, decision, decided_by, decided_at]
    properties:
      release_id:
        $ref: "#/$defs/ReleaseId"
      artifact:
        $ref: "#/$defs/ArtifactRef"
      decision:
        $ref: "#/$defs/Decision"
      decided_by:
        $ref: "#/$defs/Actor"
      decided_at:
        $ref: "#/$defs/Timestamp"
    examples:
      - release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
        artifact:
          name: shipyard-api
          version: 3
        decision: approved
        decided_by: dana
        decided_at: "2026-11-25T10:20:00Z"

  # ---------------------------------------------------------------- shared values (also used by api-*.yml)

  EventId:
    x-assumed: [Q-15]
    description: UUID string assigned by the sender (Q-15 default).
    type: string
    format: uuid
    examples: [0b7f3a52-9c1d-4e8a-8f43-2d6c1b9e7a01]

  BuildId:
    x-assumed: [Q-15, Q-28]
    description: >
      ID of one pipeline run (a run is a build; Q-28 default), a UUID string assigned by pipeline-runner
      (Q-15 default). The same name, `build_id`, is used in every file.
    type: string
    format: uuid
    examples: [5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701]

  ReleaseId:
    x-assumed: [Q-15]
    description: ID of one release request, a UUID string assigned by release-service (Q-15 default).
    type: string
    format: uuid
    examples: [7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07]

  Timestamp:
    x-assumed: [Q-15]
    description: RFC 3339 date-time in UTC with the `Z` suffix (Q-15 default).
    type: string
    format: date-time
    pattern: "Z$"
    examples: ["2026-11-25T10:00:00Z"]

  PipelineName:
    x-assumed: [Q-19]
    description: The `name` of the pipeline definition the run was started with (Q-19 default shape).
    type: string
    minLength: 1
    examples: [shipyard-api]

  StepName:
    x-assumed: [Q-19]
    description: The `name` of a step in the pipeline definition (Q-19 default shape).
    type: string
    minLength: 1
    examples: [test]

  BuildOutcome:
    x-assumed: [Q-13]
    description: Final result of a run (Q-13 default).
    type: string
    enum: [passed, failed]
    examples: [passed]

  StepStatus:
    x-assumed: [Q-20]
    description: >
      State of one step. `pending` = not started yet; `running`; `passed`; `failed`; `skipped` = never run
      because an earlier step failed (the run stops at the first failed step, Q-20 default). In a build.finished
      event only `passed`, `failed` and `skipped` occur.
    type: string
    enum: [pending, running, passed, failed, skipped]
    examples: [passed]

  StepResult:
    x-assumed: [Q-14, Q-20]
    description: >
      Result of one step, used in build.finished (Q-14 default) and in pipeline-runner's run resource (Q-20
      default). `started_at` is present once the step started; `finished_at` once it passed or failed.
    type: object
    additionalProperties: false
    required: [name, status]
    properties:
      name:
        $ref: "#/$defs/StepName"
      status:
        $ref: "#/$defs/StepStatus"
      started_at:
        $ref: "#/$defs/Timestamp"
      finished_at:
        $ref: "#/$defs/Timestamp"
    examples:
      - name: test
        status: failed
        started_at: "2026-11-25T11:01:10Z"
        finished_at: "2026-11-25T11:02:05Z"
      - name: package
        status: skipped

  ArtifactName:
    description: >
      Artifact name as chosen by the uploader; used as a path segment in artifact-store. Allowed characters are
      not settled (Q-29).
    type: string
    minLength: 1
    examples: [shipyard-api]

  ArtifactVersion:
    x-assumed: [Q-17]
    description: Integer version assigned by artifact-store per artifact name, starting at 1 (Q-17 default).
    type: integer
    minimum: 1
    examples: [3]

  Checksum:
    x-assumed: [Q-17]
    description: SHA-256 of the artifact bytes as 64 lowercase hex characters, computed by artifact-store (Q-17 default).
    type: string
    pattern: "^[0-9a-f]{64}$"
    examples: [9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08]

  ArtifactRef:
    x-assumed: [Q-16]
    description: Points at one stored artifact version by name + version (what a release references, Q-16 default).
    type: object
    additionalProperties: false
    required: [name, version]
    properties:
      name:
        $ref: "#/$defs/ArtifactName"
      version:
        $ref: "#/$defs/ArtifactVersion"
    examples:
      - name: shipyard-api
        version: 3

  Artifact:
    x-assumed: [Q-17]
    description: >
      Metadata of one stored artifact version: the data of artifact.uploaded and the body artifact-store
      returns for an upload. `build_id` is the run it came from (Q-17 default); artifact-store records it as
      sent and does not check it with pipeline-runner.
    type: object
    additionalProperties: false
    required: [name, version, checksum, size_bytes, build_id, uploaded_at]
    properties:
      name:
        $ref: "#/$defs/ArtifactName"
      version:
        $ref: "#/$defs/ArtifactVersion"
      checksum:
        $ref: "#/$defs/Checksum"
      size_bytes:
        x-assumed: [Q-18]
        description: Size of the stored bytes; at most 100 MiB (Q-18 default).
        type: integer
        minimum: 0
        maximum: 104857600
      build_id:
        $ref: "#/$defs/BuildId"
      uploaded_at:
        $ref: "#/$defs/Timestamp"
    examples:
      - name: shipyard-api
        version: 3
        checksum: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        size_bytes: 1048576
        build_id: 5d0c6f1e-2b7a-4c39-9e8d-41a2f6b3c701
        uploaded_at: "2026-11-25T10:04:30Z"

  Decision:
    x-assumed: [Q-13]
    description: An approve or reject decision on a release (Q-13 default).
    type: string
    enum: [approved, rejected]
    examples: [approved]

  Actor:
    x-assumed: [Q-09, Q-10]
    description: >
      Who made a decision, as a free string sent by the caller. There is no authentication (Q-09 default), so
      release-service records the value as sent and does not verify it (Q-10 default).
    type: string
    minLength: 1
    examples: [dana]

oneOf:
  - $ref: "#/$defs/BuildStarted"
  - $ref: "#/$defs/BuildFinished"
  - $ref: "#/$defs/ArtifactUploaded"
  - $ref: "#/$defs/ReleaseRequested"
  - $ref: "#/$defs/ReleaseDecided"
