openapi: 3.1.0
info:
  title: release-service
  version: "0.1.0"
  description: >
    Holds a release request, records an approve or reject decision with who and when, and blocks promotion
    until approved.


    Calls it makes (see the table in api-dashboard.yml): it POSTs `release.requested` after a release is created
    and `release.decided` after a decision, to the dashboard's `POST /events`. It does not call artifact-store
    to check that the referenced artifact exists (user decision, Q-16, #32). There is no promotion event (user
    decision, Q-14, #31).


    Rules (user decisions, Q-10, #30 and Q-16, #32): a release references one artifact
    by name + version; the decision body carries `decided_by` (free string) and the server sets `decided_at`;
    one decision per release, and it is final (a second decision is 409 release_already_decided); a rejected
    release stays rejected and a new release is requested instead; there is no self-approval rule; promotion is
    a recorded state change only (`promoted_at`) and is 409 release_not_approved unless the release is approved;
    any client may call promote. Not settled: who calls the decision endpoint, and whether the dashboard pages
    may call these endpoints from the browser (Q-32); what a second promote of an already promoted release
    returns (Q-31).


    Authentication: none in waves 1-2 (trusted local network), revisited in wave 3 (user decision, Q-09, #29),
    so `decided_by` is whatever the caller sends. There is no security scheme.
paths:
  /releases:
    post:
      operationId: requestRelease
      summary: Request a release of one artifact version
      description: Creates a release with status `pending` and answers 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseRequest"
            examples:
              request:
                value:
                  artifact:
                    name: shipyard-api
                    version: 3
      responses:
        "201":
          description: The new release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
              examples:
                pending:
                  value:
                    release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
                    artifact:
                      name: shipyard-api
                      version: 3
                    status: pending
                    requested_at: "2026-11-25T10:10:00Z"
                    decided_by: null
                    decided_at: null
                    promoted_at: null
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /releases/{release_id}:
    get:
      operationId: getRelease
      summary: One release
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
      responses:
        "200":
          description: The release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
              examples:
                approved:
                  value:
                    release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
                    artifact:
                      name: shipyard-api
                      version: 3
                    status: approved
                    requested_at: "2026-11-25T10:10:00Z"
                    decided_by: dana
                    decided_at: "2026-11-25T10:20:00Z"
                    promoted_at: null
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /releases/{release_id}/decision:
    post:
      operationId: decideRelease
      summary: Record the approve or reject decision
      description: >
        Records the decision, who made it (`decided_by`, as sent) and when (`decided_at`, set by the server), and
        answers 200 with the updated release. Error precedence: 422 for a malformed path parameter, then 404,
        then 422 for the body, then 409 release_already_decided.
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
            examples:
              approve:
                value:
                  decision: approved
                  decided_by: dana
              reject:
                value:
                  decision: rejected
                  decided_by: lee
      responses:
        "200":
          description: The release with its decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
              examples:
                approved:
                  value:
                    release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
                    artifact:
                      name: shipyard-api
                      version: 3
                    status: approved
                    requested_at: "2026-11-25T10:10:00Z"
                    decided_by: dana
                    decided_at: "2026-11-25T10:20:00Z"
                    promoted_at: null
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The release already has a decision (release_already_decided).
          content:
            application/json:
              schema:
                $ref: "errors.yml#/$defs/ErrorEnvelope"
              examples:
                already-decided:
                  value:
                    error:
                      code: release_already_decided
                      message: release 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07 is already approved
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /releases/{release_id}/promote:
    post:
      operationId: promoteRelease
      summary: Promote an approved release
      description: >
        Records `promoted_at` and answers 200 with the release; no request body. 409 release_not_approved unless
        the release status is `approved` (user decision, Q-16, #32). What a second promote of a release that already has
        `promoted_at` returns is not settled (Q-31). No event is sent for a promotion (user decision, Q-14, #31). Error
        precedence: 422 for a malformed path parameter, then 404, then 409.
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
      responses:
        "200":
          description: The promoted release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
              examples:
                promoted:
                  value:
                    release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
                    artifact:
                      name: shipyard-api
                      version: 3
                    status: approved
                    requested_at: "2026-11-25T10:10:00Z"
                    decided_by: dana
                    decided_at: "2026-11-25T10:20:00Z"
                    promoted_at: "2026-11-25T10:30:00Z"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The release is pending or rejected (release_not_approved).
          content:
            application/json:
              schema:
                $ref: "errors.yml#/$defs/ErrorEnvelope"
              examples:
                not-approved:
                  value:
                    error:
                      code: release_not_approved
                      message: release 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07 is pending, not approved
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    ReleaseId:
      name: release_id
      in: path
      required: true
      description: The release's `release_id`; a value that is not a UUID is 422 validation_failed.
      schema:
        $ref: "events.yml#/$defs/ReleaseId"

  schemas:
    ReleaseRequest:
      x-assumed: [Q-30]
      description: >
        Body of a release request: the one artifact version to release (user decision, Q-16, #32). Who requests is not
        recorded (Q-30 default, needs-decision: placeholder, not decided).
      type: object
      additionalProperties: false
      required: [artifact]
      properties:
        artifact:
          $ref: "events.yml#/$defs/ArtifactRef"
      examples:
        - artifact:
            name: shipyard-api
            version: 3

    DecisionRequest:
      description: Body of a decision (user decision, Q-10, #30). `decided_at` is set by the server, never sent.
      type: object
      additionalProperties: false
      required: [decision, decided_by]
      properties:
        decision:
          $ref: "events.yml#/$defs/Decision"
        decided_by:
          $ref: "events.yml#/$defs/Actor"
      examples:
        - decision: approved
          decided_by: dana

    ReleaseStatus:
      x-assumed: [Q-13]
      description: >
        `pending` until a decision is recorded, then the decision (events.yml Decision, referenced, not copied),
        which is final (user decision, Q-10, #30). The dashboard uses this schema for its release view.
      anyOf:
        - const: pending
        - $ref: "events.yml#/$defs/Decision"
      examples: [pending, approved]

    Release:
      x-assumed: [Q-30]
      description: >
        One release. Fields not known yet are present and null. The anyOf is the state table the schema
        enforces: pending means `decided_by`, `decided_at` and `promoted_at` are null; approved means
        `decided_by` and `decided_at` are set and `promoted_at` is null until promoted; rejected means
        `decided_by` and `decided_at` are set and `promoted_at` is null (only an approved release can be
        promoted, user decision, Q-16, #32). There is no requester field (Q-30 default).
      type: object
      additionalProperties: false
      required: [release_id, artifact, status, requested_at, decided_by, decided_at, promoted_at]
      properties:
        release_id:
          $ref: "events.yml#/$defs/ReleaseId"
        artifact:
          $ref: "events.yml#/$defs/ArtifactRef"
        status:
          $ref: "#/components/schemas/ReleaseStatus"
        requested_at:
          $ref: "events.yml#/$defs/Timestamp"
        decided_by:
          anyOf:
            - $ref: "events.yml#/$defs/Actor"
            - type: "null"
        decided_at:
          anyOf:
            - $ref: "events.yml#/$defs/Timestamp"
            - type: "null"
        promoted_at:
          anyOf:
            - $ref: "events.yml#/$defs/Timestamp"
            - type: "null"
      anyOf:
        - properties:
            status:
              const: pending
            decided_by:
              type: "null"
            decided_at:
              type: "null"
            promoted_at:
              type: "null"
        - properties:
            status:
              const: approved
            decided_by:
              $ref: "events.yml#/$defs/Actor"
            decided_at:
              $ref: "events.yml#/$defs/Timestamp"
        - properties:
            status:
              const: rejected
            decided_by:
              $ref: "events.yml#/$defs/Actor"
            decided_at:
              $ref: "events.yml#/$defs/Timestamp"
            promoted_at:
              type: "null"
      examples:
        - release_id: 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07
          artifact:
            name: shipyard-api
            version: 3
          status: pending
          requested_at: "2026-11-25T10:10:00Z"
          decided_by: null
          decided_at: null
          promoted_at: null

  responses:
    NotFound:
      description: No release with this `release_id` (not_found).
      content:
        application/json:
          schema:
            $ref: "errors.yml#/$defs/ErrorEnvelope"
          examples:
            not-found:
              value:
                error:
                  code: not_found
                  message: release 7b6a5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c07 not found
    ValidationFailed:
      description: The request is invalid (validation_failed).
      content:
        application/json:
          schema:
            $ref: "errors.yml#/$defs/ErrorEnvelope"
          examples:
            invalid:
              value:
                error:
                  code: validation_failed
                  message: request validation failed
                  details:
                    - location: body.decision
                      message: must be one of approved, rejected
    InternalError:
      description: Unexpected server error (internal_error).
      content:
        application/json:
          schema:
            $ref: "errors.yml#/$defs/ErrorEnvelope"
          examples:
            internal:
              value:
                error:
                  code: internal_error
                  message: unexpected error
