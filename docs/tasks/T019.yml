summary: >
  Docs-only proposal for the wave 2 setup decisions (Q-03, user decision on #25). Add one section to
  docs/team/environment.md headed exactly "## Wave 2 setup (proposal, T019)", whose first line after the heading is
  exactly "Status: proposed, awaiting user approval (issue #25)", followed by one table with columns
  | Item | Proposal | Reason | and one row per item below (first cell exactly as named), each concrete for all four
  services (pipeline-runner, artifact-store, release-service, dashboard) where it differs per service.
  Rows: "Folder layout" (services/<name>/ with app/, app/repos/, db/ if any, tests/; where the stack-level HTTP tests
  live, never e2e/). "pyproject.toml" (one per service, managed with uv, one uv.lock per service; the [project],
  dependency-group and [tool.ruff]/[tool.mypy] (files = [...])/[tool.pytest]/[tool.coverage] tables it must have;
  coverage thresholds stay the lead's to set). "Python version" (exact requires-python and how uv pins it).
  "Data access" (user decision: SQLite for every service for now, a different database later, so data access must
  be easy to swap: all SQL behind app/repos/, one database URL env var per service, no SQLite-only features outside
  the repos). "SQLite file" (env var name per service, default path per service and per worktree, so two worktrees
  or two services never share a file; the path is outside the repo or covered by a .gitignore entry, naming the
  later task that adds it; how this replaces the shipyard_<task>_<agent>_<service> database-name rule).
  "Migrations" (tool, or "none in wave 2" with the reason and when that changes). "Ports" (port base and a formula
  port = f(slot, service order) with a worked example for slots 0 and 1; slot 0 is the lead's/local default).
  "Start command" (the one local command that starts all four, plus one per service). "Script names" (exact script
  paths and names, e.g. under scripts/). "Dashboard static files" (Q-02: folder, owned by frontend-dev, served by
  the dashboard app owned by backend-dev). "Error envelope" (Q-21: where the shared exception handlers and the
  OpenAPI error-response override live, per service or a shared module, and how a service imports it without a
  cross-service package dependency). "CI per service" (one job or matrix entry per service running uv sync, ruff,
  mypy and pytest from services/<s>/, feeding ci-ok; where the Q-22 conformance comparison runs; pin third-party
  GitHub Actions by commit SHA). "Contracts" (Q-01 follow-up #36: the layout map's docs/API.md means
  contracts/api-<service>.yml, the shared contract is contracts/events.yml and contracts/errors.yml, contracts/**
  is frozen; where per-service data models go). Update the existing § "Open", § "Commands" and the Ports bullet of
  § "Worktrees, ports and databases" to point to the new section (still as a proposal), without deleting what the
  user decided. Writes no service code, no pyproject.toml, no script and no CI change; those are later wave 2
  tasks specified only after the project owner approves. Anything this task cannot settle (e.g. inter-service auth, Q-09) goes
  under Open questions in the report, not into the table.
