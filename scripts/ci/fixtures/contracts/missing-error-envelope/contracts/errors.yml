$schema: https://json-schema.org/draft/2020-12/schema
$id: https://shipyard.invalid/contracts/errors.yml
$defs:
  ErrorCode:
    type: string
    enum: [not_found, validation_failed, internal_error]
    examples: [not_found]
  Renamed:
    type: object
    additionalProperties: false
    required: [error]
    properties:
      error:
        type: object
        additionalProperties: false
        required: [code, message]
        properties:
          code:
            $ref: "#/$defs/ErrorCode"
          message:
            type: string
    examples:
      - error:
          code: not_found
          message: build not found
x-status-codes:
  - {status: 404, code: not_found, meaning: The resource does not exist}
  - {status: 422, code: validation_failed, meaning: The request body is invalid}
  - {status: 500, code: internal_error, meaning: Unexpected server error}
