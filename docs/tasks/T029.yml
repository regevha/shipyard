acceptance:
  - |-
    python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('docs/tasks/*.yml')]; print('ok')"  # prints ok
  - |-
    python3 -c "
    import yaml
    req = {'id','title','owner','branch','mode','ui','wave','depends_on','migration','read_first','files_touched','acceptance','summary'}
    for n in range(29, 35):
        t = f'T0{n}'; d = yaml.safe_load(open(f'docs/tasks/{t}.yml'))
        assert d['id'] == t and req <= set(d), (t, req - set(d))
        assert 'issue' not in d, t
        assert d['branch'].startswith(t + '-') or d['branch'] == 'spec-T029-followups', t
        assert d['wave'] == 2 and d['migration'] is False and d['ui'] is False, t
        assert all(x.startswith('T') and int(x[1:]) < n for x in d['depends_on']), t
        assert n == 29 or 'T029' in d['depends_on'], t
    print('specs ok')"  # prints specs ok
  - |-
    python3 -B -c "
    import itertools, re, sys, yaml
    sys.path.insert(0, 'scripts/ci'); from check_task_scope import matches
    names = ['pipeline-runner', 'artifact-store', 'release-service', 'dashboard', 'x']
    def instances(p):
        parts = re.split(r'(\*\*|\*)', p)
        slots = [names if x == '*' else ['x/y', 'x'] if x == '**' else [x] for x in parts]
        return {''.join(c) for c in itertools.product(*slots)}
    def overlap(a, b): return any(matches(i, b) for i in instances(a)) or any(matches(i, a) for i in instances(b))
    groups = {'F1': ['T030', 'T031', 'T032'], 'F2': ['T033'], 'F3': ['T034']}
    ft = {t: yaml.safe_load(open(f'docs/tasks/{t}.yml'))['files_touched'] for g in groups.values() for t in g}
    bad = [(t1, p1, t2, p2) for g in groups.values() for t1, t2 in itertools.combinations(g, 2)
           for p1 in ft[t1] for p2 in ft[t2] if overlap(p1, p2)]
    assert not bad, bad
    assert all(len(g) <= 3 for g in groups.values())
    assert overlap('services/*/app/main.py', 'services/dashboard/app/main.py') and overlap('services/dashboard/app/repos/**', 'services/dashboard/app/repos/views.py')
    assert not overlap('services/artifact-store/app/core/**', 'services/release-service/app/core/events.py')
    print('disjoint')"  # prints disjoint (F1's three tasks share no file; F2 and F3 have one task each)
  - |-
    python3 -c "
    import re, os, yaml
    def slug(h): return re.sub(r'[^\w\- ]', '', h.strip().lower().replace('\`', '')).replace(' ', '-')
    bad = []
    for n in range(29, 35):
        d = yaml.safe_load(open(f'docs/tasks/T0{n}.yml'))
        for r in d['read_first']:
            f, _, frag = r.partition('#')
            m = re.fullmatch(r'docs/tasks/(T\d+)\.md', f)
            if m and (m.group(1) in d['depends_on'] or m.group(1) == 'T029'): continue
            if not os.path.exists(f): bad.append(r); continue
            if not frag: continue
            if frag.startswith('/'):
                node = yaml.safe_load(open(f))
                try:
                    for part in frag[1:].split('/'): node = node[part.replace('~1', '/').replace('~0', '~')]
                except (KeyError, TypeError): bad.append(r)
            elif frag not in {slug(l.lstrip('#')) for l in open(f) if l.startswith('#')}: bad.append(r)
    assert not bad, bad
    print('read_first ok')"  # prints read_first ok (hand-offs of dependencies are created later)
  - |-
    python3 -c "
    import yaml
    ev = yaml.safe_load(open('contracts/events.yml'))['\$defs']
    assert ev['ArtifactVersion']['maximum'] == 2**63 - 1 == 9223372036854775807
    assert ev['FailureReason']['enum'] == ['artifact upload failed', 'internal error']
    assert ev['InterruptedRunSteps']['maxContains'] == 1 and ev['InterruptedRunSteps']['minContains'] == 0
    rows = {'events BuildFinishedData': ev['BuildFinishedData']['anyOf'],
            'runner Run': yaml.safe_load(open('contracts/api-pipeline-runner.yml'))['components']['schemas']['Run']['anyOf'],
            'dashboard BuildView': yaml.safe_load(open('contracts/api-dashboard.yml'))['components']['schemas']['BuildView']['anyOf']}
    for name, r in rows.items():
        reasons = [x['properties']['failure_reason'] for x in r]
        assert {'const': 'internal error'} in reasons and {'const': 'artifact upload failed'} in reasons, name
        assert not any('\$ref' in x for x in reasons), name
        ie = next(x for x in r if x['properties']['failure_reason'] == {'const': 'internal error'})['properties']
        assert ie['failed_step'] == {'type': 'null'} and ie['steps']['\$ref'].endswith('InterruptedRunSteps'), name
    print('contract changes ok')"  # prints contract changes ok (Q-40 cap; Q-41 reason and the fourth state row in all three tables)
  - |-
    python3 -c "
    import yaml, glob
    bad, seen = [], []
    def walk(n, path):
        if isinstance(n, dict):
            if 'version' in (n.get('properties') or {}):
                seen.append('/'.join(path)); v = n['properties']['version']
                if v.get('\$ref', '').split('#')[-1] != '/\$defs/ArtifactVersion': bad.append('/'.join(path))
            if n.get('name') == 'version' and n.get('in') == 'path':
                seen.append('/'.join(path))
                if not n['schema']['\$ref'].endswith('/ArtifactVersion'): bad.append('/'.join(path))
            for k, v in n.items(): walk(v, path + (str(k),))
        elif isinstance(n, list):
            for i, v in enumerate(n): walk(v, path + (str(i),))
    for f in sorted(glob.glob('contracts/*.yml')): walk(yaml.safe_load(open(f)), (f,))
    assert not bad, bad
    assert len(seen) >= 3, seen
    print('every version capped:', len(seen))"  # prints every version capped: 3 (Artifact, ArtifactRef, the download path parameter; every version schema in the six files is a ref to ArtifactVersion)
  - |-
    python3 -c "
    import yaml, glob
    bad = []
    def walk(n, path):
        if isinstance(n, dict):
            if isinstance(n.get('pattern'), str) and path[-1:] != ('not',) and (n.get('not') or {}).get('pattern') != '\n':
                bad.append('/'.join(path))
            for k, v in n.items(): walk(v, path + (str(k),))
        elif isinstance(n, list):
            for i, v in enumerate(n): walk(v, path + (str(i),))
    for f in sorted(glob.glob('contracts/*.yml')): walk(yaml.safe_load(open(f)), (f,))
    assert not bad, bad
    print('every pattern guarded')"  # prints every pattern guarded (#121 still holds)
